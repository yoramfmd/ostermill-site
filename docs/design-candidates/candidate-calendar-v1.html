document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ly:'IBM Plex Mono',monospace;font-size:10px;color:#55534D;line-height:1.7;max-width:920px;\">\n        <div style=\"letter-spacing:1.5px;color:#14171A;font-weight:700;padding-bottom:4px;\">DEVIATIONS, ANNOTATED<\u002Fdiv>\n        <div>· 11 Aug rendered as a scheduled review, not a ghost — once the error was found a meeting existed; only 21 Jul and 4 Aug are unseeable.<\u002Fdiv>\n        <div>· Operate strip begins September — August's grid already belongs to OBSERVE; repeating it would pad the strip.<\u002Fdiv>\n        <div>· Year fixed to 2025 so the published weekdays (Mon 3 Mar, Mon 21 Jul, Mon 4 Aug) fall true on the grid.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ readerLayer }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:40;background:#14171A;color:#C9CDD2;font-family:'IBM Plex Mono',monospace;font-size:10px;display:flex;align-items:center;gap:12px;padding:6px 16px;\">\n      <span style=\"background:#E8AE00;color:#14171A;font-weight:700;padding:1px 7px;letter-spacing:1px;\">CF-021<\u002Fspan>\n      <span>Ostermill is a designed composite.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ popupOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;background:rgba(20,23,26,.45);display:flex;align-items:center;justify-content:center;padding:12px;\" sc-camel-on-click=\"{{ close }}\">\n      <div style=\"background:#FBFAF7;border:1px solid #14171A;width:min(700px,100%);max-height:min(88vh,900px);overflow:auto;box-shadow:0 12px 32px rgba(20,23,26,.3);\" sc-camel-on-click=\"{{ stop }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;background:#14171A;color:#C9CDD2;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;padding:8px 14px;\">\n          <span>{{ m.form }} · MINUTES OF RECORD<\u002Fspan>\n          <sc-if value=\"{{ m.transcript }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"background:#E8AE00;color:#14171A;font-weight:700;padding:1px 6px;\">{{ m.transcript }}<\u002Fspan>\n          <\u002Fsc-if>\n          <span style=\"margin-left:auto;cursor:pointer;color:#EDEBE6;border:1px solid #55534D;padding:1px 8px;\" style-hover=\"color:#E8AE00;border-color:#E8AE00;\" sc-camel-on-click=\"{{ close }}\">✕<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px 20px;\">\n          <div style=\"font-family:'Archivo Black',sans-serif;font-size:21px;color:#14171A;line-height:1.2;\">{{ m.title }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#55534D;padding:6px 0 12px;\">{{ m.date }}<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;padding-bottom:16px;\">\n            <sc-for list=\"{{ m.participants }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;border:1px solid #14171A;color:#14171A;padding:2px 7px;letter-spacing:.5px;\">{{ p }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#8E8C86;border-bottom:1px solid #D8D6D0;padding-bottom:3px;\">SUMMARY<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#14171A;line-height:1.65;padding:8px 0 16px;text-wrap:pretty;\">{{ m.summary }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#8E8C86;border-bottom:1px solid #D8D6D0;padding-bottom:3px;\">DECISIONS<\u002Fdiv>\n          <div style=\"padding:8px 0 16px;display:grid;gap:6px;\">\n            <sc-for list=\"{{ m.decisions }}\" as=\"d\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#14171A;line-height:1.5;\">\n                <span style=\"font-weight:700;min-width:18px;\">{{ d.n }}<\u002Fspan><span>{{ d.t }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#8E8C86;border-bottom:1px solid #D8D6D0;padding-bottom:3px;\">ACTIONS<\u002Fdiv>\n          <div style=\"padding:8px 0 16px;display:grid;gap:6px;\">\n            <sc-for list=\"{{ m.actions }}\" as=\"a\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;gap:10px;align-items:baseline;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#14171A;line-height:1.5;\">\n                <span style=\"color:#8E8C86;\">▸<\u002Fspan><span>{{ a.t }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:10px;border:1px solid #14171A;padding:1px 6px;white-space:nowrap;\">{{ a.owner }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:#8E8C86;border-bottom:1px solid #D8D6D0;padding-bottom:3px;\">ATTACHMENTS<\u002Fdiv>\n          <div style=\"padding:8px 0 2px;display:flex;gap:8px;flex-wrap:wrap;\">\n            <sc-for list=\"{{ m.attachments }}\" as=\"at\" hint-placeholder-count=\"2\">\n              <span style=\"display:inline-flex;align-items:center;gap:7px;border:1px solid #14171A;padding:3px 9px 3px 3px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#14171A;\">\n                <span style=\"background:#14171A;color:#E8AE00;font-weight:700;padding:1px 6px;\">{{ at.l }}<\u002Fspan>{{ at.label }}\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;readerLayer&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Reader chrome&quot; },\n  &quot;bandStyle&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;bar&quot;, &quot;tick&quot;], &quot;default&quot;: &quot;bar&quot;, &quot;tsType&quot;: &quot;'bar' | 'tick'&quot;, &quot;section&quot;: &quot;Reader chrome&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { openId: 'adjudication' };\n\n  minutes = {\n    opsreview: { form:'OM-MIN-2025-006', title:'Operations review', date:'Tuesday 25 February 2025 · Room 2B · 09:00',\n      participants:['VANCE.R','OKAFOR.D','ADEYEMI.S','HART.J'],\n      summary:'Standing monthly review of AR operations. One sentence near the close — the dunning letters take half the clerk\\u2019s week — logged without discussion.',\n      decisions:[{n:'—',t:'None taken.'}],\n      actions:[{t:'None recorded.',owner:'—'}],\n      attachments:[{l:'A',label:'Ops review note, 25 Feb'}] },\n    demo: { form:'OM-MIN-2025-007', title:'Working demo — first showing', date:'Friday 28 February 2025 · Room 2B · 08:30', transcript:'T1',\n      participants:['OKAFOR.D','VANCE.R','LIU.M','ADEYEMI.S','HART.J','BRENNAN.K'],\n      summary:'A working demo, built in four hours the previous Thursday, drafted three dunning letters from live account data. Shown to six people. No commitments made beyond looking closer.',\n      decisions:[{n:'1',t:'One observation week authorized beside the AR clerk, week of 3 March.'}],\n      actions:[{t:'Schedule the observation week; no tooling changes in the interim.',owner:'OKAFOR.D'}],\n      attachments:[{l:'B',label:'Demo build log, 27 Feb'}] },\n    obsweek: { form:'OM-MIN-2025-008', title:'Observation week — AR desk', date:'Monday 3 March 2025 · AR desk · all week',\n      participants:['OKAFOR.D','VANCE.R'],\n      summary:'Observation begins beside the AR clerk. Every letter drafted this week is logged with its inputs, elapsed time, and outcome. Median observed: 11 minutes per letter.',\n      decisions:[{n:'—',t:'None taken.'}],\n      actions:[{t:'Freeze the week\\u2019s letters and inputs as a corpus.',owner:'LIU.M'}],\n      attachments:[{l:'C',label:'Observation corpus, week of 3 Mar'}] },\n    adjudication: { form:'OM-MIN-2025-014', title:'Prototype adjudication', date:'Wednesday 26 March 2025 · Room 4A · 14:00', transcript:'T2',\n      participants:['OKAFOR.D','VANCE.R','LIU.M','ADEYEMI.S','HART.J','BRENNAN.K'],\n      summary:'The prototype was run against fourteen live cases from the observation corpus and adjudicated line by line against the clerk\\u2019s own drafts. Eleven were judged equivalent or better; three were judged unsendable, all three involving disputed balances. The session closed on scope rather than capability.',\n      decisions:[\n        {n:'1',t:'The prototype advances to Design. Scope is limited to drafting dunning letters; nothing else.'},\n        {n:'2',t:'The agent drafts only. Send authority remains with the AR clerk, without exception.'},\n        {n:'3',t:'The baseline is fixed: clerk median of 11 minutes per letter, observed week of 3 March.'},\n        {n:'4',t:'No production traffic before the eval gate is passed (project weeks 8–11).'},\n        {n:'5',t:'Accounts with disputed balances are excluded from the agent\\u2019s queue entirely.'}],\n      actions:[\n        {t:'Draft the go/no-go memo for 2 April.',owner:'OKAFOR.D'},\n        {t:'Freeze the adjudication corpus and annotations as evidence.',owner:'LIU.M'},\n        {t:'Book the approval-screen walkthrough for early May.',owner:'HART.J'}],\n      attachments:[\n        {l:'C',label:'Observation corpus, week of 3 Mar'},\n        {l:'D',label:'Adjudication run, annotated transcript'}] },\n    gomemo: { form:'OM-MEM-2025-002', title:'Go memo issued', date:'Wednesday 2 April 2025 · circulated by document',\n      participants:['OKAFOR.D'],\n      summary:'The go memo closes DECIDE. It records the suitability case, the fixed baseline, and the exclusions, and authorizes Design. No meeting was held; the memo is the event.',\n      decisions:[{n:'1',t:'The project proceeds to Design.'}],\n      actions:[{t:'None recorded.',owner:'—'}],\n      attachments:[{l:'E',label:'Go memo, 2 April'}] },\n    briefs: { form:'OM-MIN-2025-019', title:'The two briefs — review', date:'Tuesday 22 April 2025 · Room 4A · 10:00', transcript:'T3',\n      participants:['OKAFOR.D','LIU.M','ADEYEMI.S','BRENNAN.K'],\n      summary:'The Human Brief and the Executable Brief, both dated 22 April, were read against each other. Where they disagreed, the Human Brief governed and the Executable Brief was corrected.',\n      decisions:[\n        {n:'1',t:'The Human Brief is adopted as written.'},\n        {n:'2',t:'The Executable Brief is adopted with the corrections logged in session.'}],\n      actions:[{t:'Reconcile the correction log into both documents.',owner:'BRENNAN.K'}],\n      attachments:[{l:'F',label:'Human Brief, 22 April'},{l:'G',label:'Executable Brief, 22 April'}] },\n    approval: { form:'OM-MIN-2025-022', title:'Approval screen — walkthrough', date:'Tuesday 6 May 2025 · AR desk · 11:00', transcript:'T4',\n      participants:['OKAFOR.D','VANCE.R','HART.J'],\n      summary:'The approval screen was walked through at the AR desk with the clerk operating it. Two labels were rewritten in session; the reject path was shortened to one click.',\n      decisions:[{n:'1',t:'The approval screen is adopted as the sole path to send.'}],\n      actions:[{t:'Apply the two label rewrites before eval build.',owner:'HART.J'}],\n      attachments:[{l:'H',label:'Approval screen, walkthrough spec'}] },\n    eval8: { form:'OM-MIN-2025-027', title:'Eval pass 1', date:'Project week 8 · Room 4A',\n      participants:['LIU.M','OKAFOR.D','BRENNAN.K'],\n      summary:'First full pass against the frozen corpus. Below gate on disputed-adjacent phrasing; everything else within tolerance.',\n      decisions:[{n:'1',t:'Gate not passed. Two more passes scheduled.'}],\n      actions:[{t:'Tighten the exclusion boundary and re-run.',owner:'LIU.M'}],\n      attachments:[{l:'I',label:'Eval report, cumulative'}] },\n    eval10: { form:'OM-MIN-2025-031', title:'Eval pass 2', date:'Project week 10 · Room 4A',\n      participants:['LIU.M','OKAFOR.D','BRENNAN.K'],\n      summary:'Second pass. Within gate on all slices; worst slice within two points of median.',\n      decisions:[{n:'1',t:'Gate provisionally passed; one confirming pass required.'}],\n      actions:[{t:'Hold the corpus unchanged for pass 3.',owner:'LIU.M'}],\n      attachments:[{l:'I',label:'Eval report, cumulative'}] },\n    readiness: { form:'OM-MIN-2025-033', title:'Readiness review · launch decision', date:'Project week 11 · Room 2B', transcript:'T5',\n      participants:['OKAFOR.D','VANCE.R','LIU.M','ADEYEMI.S','HART.J','BRENNAN.K'],\n      summary:'Eval pass 3 confirmed pass 2. Readiness reviewed owner by owner: clerk, ops, engineering, audit. The launch decision was taken in the same session.',\n      decisions:[\n        {n:'1',t:'Launch approved, effective project week 12.'},\n        {n:'2',t:'Supervised mode for the first thirty days; the clerk approves every send.'}],\n      actions:[{t:'File the readiness memo with all owners\\u2019 signatures.',owner:'OKAFOR.D'}],\n      attachments:[{l:'I',label:'Eval report, cumulative'},{l:'J',label:'Readiness memo, all owners'}] },\n    incident: { form:'OM-MIN-2025-041', title:'Exception review — correspondence', date:'Monday 11 August 2025 · Room 2B · 09:00', transcript:'T6',\n      participants:['OKAFOR.D','VANCE.R','LIU.M','ADEYEMI.S'],\n      summary:'A dunning letter carrying an incorrect balance was sent 21 July and identified 4 August through a customer call. No meeting preceded either date; this review was reconstructed from the audit log.',\n      decisions:[\n        {n:'1',t:'The disputed-balance exclusion is extended to cover balances adjusted within 30 days.'},\n        {n:'2',t:'A detection threshold is added to the observation instruments; fourteen days to detection is recorded as the number to beat.'}],\n      actions:[{t:'File the incident timeline, reconstructed from the audit log.',owner:'LIU.M'}],\n      attachments:[{l:'K',label:'Incident timeline, from audit log'}] }\n  };\n\n  open(id){ if (this.minutes[id]) this.setState({ openId: id }); }\n\n  chip(kind, active){\n    const base = { display:'block', margin:'0 0 2px', fontFamily:\"Tahoma,'Segoe UI',sans-serif\", fontSize:'9px', lineHeight:'1.35', padding:'1px 3px', overflow:'hidden' };\n    if (kind === 'meeting') return Object.assign(base, { background:'#DCE4EC', border:'1px solid #9FB0C4', color:'#2E4054', cursor:'pointer', fontWeight:'700', outline: active ? '2px solid #E8AE00' : 'none', outlineOffset:'1px' });\n    if (kind === 'muted') return Object.assign(base, { color:'#9A978F', border:'1px dotted #C4C2BB' });\n    if (kind === 'note') return Object.assign(base, { background:'#E6E4DE', border:'1px solid #C4C2BB', color:'#6E6B64' });\n    if (kind === 'ghost') return Object.assign(base, { border:'1px dashed #B3261E', color:'#B3261E', fontFamily:\"'IBM Plex Mono',monospace\", fontSize:'8.5px', background:'transparent', padding:'2px 3px' });\n    if (kind === 'tick') return Object.assign(base, { color:'#14171A', fontFamily:\"'IBM Plex Mono',monospace\", fontSize:'8.5px', border:'none', padding:'1px 0', letterSpacing:'.5px' });\n    return base;\n  }\n\n  ev(kind, label, mid, t){\n    const active = mid && mid === this.state.openId;\n    const e = { kind, label, t: t || false, style: this.chip(kind, active) };\n    if (mid) { e.onOpen = () => this.open(mid); e.hoverStyle = { background:'#C9D6E4' }; }\n    return e;\n  }\n\n  buildEvents(){\n    const E = {};\n    const add = (iso, e) => { (E[iso] = E[iso] || []).push(e); };\n    // Pod sessions: Wednesdays, Mar–May and Jul–Aug\n    [[2025,2],[2025,3],[2025,4],[2025,6],[2025,7]].forEach(([y,mo]) => {\n      const dim = new Date(y, mo+1, 0).getDate();\n      for (let d=1; d<=dim; d++) if (new Date(y,mo,d).getDay() === 3)\n        add(`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, this.ev('muted','Pod session'));\n    });\n    add('2025-02-25', this.ev('meeting','Operations review','opsreview'));\n    add('2025-02-27', this.ev('note','Demo build — 4 hrs'));\n    add('2025-02-28', this.ev('meeting','Demo — six attendees','demo','T1'));\n    add('2025-03-03', this.ev('meeting','Observation week — AR desk','obsweek'));\n    ['04','05','06','07'].forEach(d => add(`2025-03-${d}`, this.ev('muted','AR desk — observation')));\n    add('2025-03-26', this.ev('meeting','Prototype adjudication','adjudication','T2'));\n    add('2025-04-02', this.ev('meeting','Go memo issued','gomemo'));\n    add('2025-04-02', this.ev('tick','◂ DECIDE closes'));\n    add('2025-04-22', this.ev('meeting','Two briefs — review','briefs','T3'));\n    add('2025-05-06', this.ev('meeting','Approval screen — walkthrough','approval','T4'));\n    add('2025-07-21', this.ev('ghost','21 JUL — wrong letter sent. no meeting existed about this.'));\n    add('2025-08-04', this.ev('ghost','4 AUG — error found, customer call. nothing was scheduled.'));\n    add('2025-08-11', this.ev('meeting','Exception review — correspondence','incident','T6'));\n    return E;\n  }\n\n  buildMonth(y, mo, label, E){\n    const dim = new Date(y, mo+1, 0).getDate();\n    const lead = (new Date(y, mo, 1).getDay() + 6) % 7;\n    const cells = [];\n    for (let i = 0; i < lead; i++) cells.push({ d: new Date(y, mo, i - lead + 1), out: true });\n    for (let d = 1; d <= dim; d++) cells.push({ d: new Date(y, mo, d), out: false });\n    while (cells.length % 7) { const p = cells[cells.length-1].d; cells.push({ d: new Date(p.getFullYear(), p.getMonth(), p.getDate()+1), out: true }); }\n    const weeks = [];\n    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i+7).map(c => {\n      const dow = (c.d.getDay() + 6) % 7;\n      const weekend = dow >= 5;\n      const iso = `${c.d.getFullYear()}-${String(c.d.getMonth()+1).padStart(2,'0')}-${String(c.d.getDate()).padStart(2,'0')}`;\n      return {\n        num: c.d.getDate(),\n        numColor: c.out ? '#C4C2BB' : '#8E8C86',\n        style: { minHeight:'54px', borderRight:'1px solid #C9C7C1', borderBottom:'1px solid #C9C7C1', padding:'1px 2px 3px', background: c.out ? '#E9E7E2' : (weekend ? '#E4E2DC' : '#F0EEE9'), opacity: c.out ? .55 : 1 },\n        events: c.out ? [] : (E[iso] || [])\n      };\n    }));\n    return { label, weeks };\n  }\n\n  renderVals(){\n    const rl = this.props.readerLayer ?? true;\n    const bandStyle = this.props.bandStyle ?? 'bar';\n    const E = this.buildEvents();\n    const m2 = (y,mo,l) => this.buildMonth(y,mo,l,E);\n    const sections = [\n      { id:'decide', label:'DECIDE', range:'late February – 2 April', note:'one sentence → a go memo', isGrid:true, months:[m2(2025,1,'FEBRUARY 2025'), m2(2025,2,'MARCH 2025')] },\n      { id:'design', label:'DESIGN', range:'2 April – early May', note:'two briefs · one approval screen', isGrid:true, months:[m2(2025,3,'APRIL 2025'), m2(2025,4,'MAY 2025')] },\n      { id:'prove', label:'PROVE', range:'project weeks 5–11', note:'dated by a week clock, not months', isStrip:true },\n      { id:'observe', label:'OBSERVE', range:'launch to the end of the quarter', note:'what the calendar cannot see', isGrid:true, months:[m2(2025,6,'JULY 2025'), m2(2025,7,'AUGUST 2025')] },\n      { id:'operate', label:'OPERATE', range:'August onward · twelve months', note:'documents govern; meetings thin out', isChips:true }\n    ];\n    const proveWeeks = [\n      { w:5, events:[] }, { w:6, events:[] }, { w:7, events:[] },\n      { w:8, events:[this.ev('meeting','Eval pass 1','eval8')] },\n      { w:9, events:[] },\n      { w:10, events:[this.ev('meeting','Eval pass 2','eval10')] },\n      { w:11, events:[this.ev('note','Eval pass 3'), this.ev('meeting','Readiness review · launch decision','readiness','T5')] }\n    ];\n    const operateChips = [\n      { label:\"SEP '25\" }, { label:\"OCT '25\", entry:'Threshold review' }, { label:\"NOV '25\" }, { label:\"DEC '25\" },\n      { label:\"JAN '26\", entry:'Model version rehearsal' }, { label:\"FEB '26\" }, { label:\"MAR '26\" },\n      { label:\"APR '26\", entry:'Annual audit' }, { label:\"MAY '26\" }, { label:\"JUN '26\" }, { label:\"JUL '26\" }, { label:\"AUG '26\" }\n    ];\n    const m = this.minutes[this.state.openId] || this.minutes.adjudication;\n    return {\n      readerLayer: rl,\n      bandBar: bandStyle === 'bar',\n      bandTick: bandStyle === 'tick',\n      dows: ['MON','TUE','WED','THU','FRI','SAT','SUN'],\n      sections, proveWeeks, operateChips,\n      popupOpen: !!this.state.openId,\n      m,\n      close: () => this.setState({ openId: null }),\n      stop: (e) => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
